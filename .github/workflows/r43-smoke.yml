name: SEMITS R4.3 development checks
on:
  push:
    branches:
      - development/v524-r43-universal-assistant
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R4.3 development
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and smoke tests
        run: node --test tests/r43-smoke.test.cjs
